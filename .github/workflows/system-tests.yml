name: System Tests

on:
  push:
    paths:
      - "version.txt"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskapi
          POSTGRES_USER: taskapi
          POSTGRES_PASSWORD: taskapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio:RELEASE.2025-01-20T14-49-07Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        command: server /data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Wait for services
        run: sleep 15

      - name: Run tests
        run: ./gradlew test