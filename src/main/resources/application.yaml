spring:
  application:
    name: taskApi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskapi}
    username: ${DB_USER:taskapi}
    password: ${DB_PASSWORD:taskapi}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 1024MB

server:
  error:
    include-message: always

app:
  jwt:
    secret: f8a3cde9b8e42a1d2a7c3d9f6e4b8c1a9d3e7f1b2c6a4e8f0d1c3b5a7e9f2d6
    issuer: ${JWT_ISSUER:taskApi}
    ttl: ${JWT_TTL:PT24H}
  storage:
    quotaLimitBytes: ${STORAGE_QUOTA_LIMIT_BYTES:1610612736} # 1.5 GiB
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      accessKey: ${S3_ACCESS_KEY:minioadmin}
      secretKey: ${S3_SECRET_KEY:minioadmin}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:taskapi}
  repeats:
    cron: ${REPEATS_CRON:0 0 3 * * *}
